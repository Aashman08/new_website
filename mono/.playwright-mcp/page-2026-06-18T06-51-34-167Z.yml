    - generic [ref=e91]:
      - heading "Challenges & Accomplishments" [level=2] [ref=e92]
      - paragraph [ref=e93]: Our primary challenge was figuring out how to generate the quantum circuit visually. We knew we wanted a 3D visual that users could interact with, but were not initially sure what software to use. After experimentation, we successfully integrated interactive Bloch sphere visualizations.
      - paragraph [ref=e94]: We were proud of being able to correctly connect Selenium to trace paths and find research papers to train our models and chatbot—all automatically. The RAG model trained on Qiskit documentation proved highly effective for code generation.
    - generic [ref=e95]:
      - heading "What's Next" [level=2] [ref=e96]
      - paragraph [ref=e97]: We hope that this tool will become a widespread quantum computing tool as many quantum researchers and students mentioned they wished it was something they had earlier. It's just the beginning in a long list of tools we plan to build to reduce barriers to entry and fast-track research.
      - list [ref=e98]:
        - listitem [ref=e99]:
          - strong [ref=e100]: "Enhanced Model Training:"
          - text: Train models using images of quantum circuits, not just text, for improved visual understanding.
        - listitem [ref=e101]:
          - strong [ref=e102]: "Complex Design Testing:"
          - text: Rigorous testing with intricate circuit designs, collaborating with researchers to refine algorithms.
        - listitem [ref=e103]:
          - strong [ref=e104]: "Platform Integration:"
          - text: Integration with IBM's quantum tools and other established platforms for a comprehensive experience.
    - generic [ref=e105]:
      - heading "Impact" [level=2] [ref=e106]
      - blockquote [ref=e107]:
        - paragraph [ref=e108]: QuantumViz bridges the gap between the complexities of quantum mechanics and the approaching era of quantum computing—making circuit design accessible, intuitive, and efficient for researchers and students alike.
