<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Projects</title>
<meta name="theme-color" content="#030208">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
<style>
:root{--bg:#030208;--site:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;--serif:"Playfair Display",Georgia,serif}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:#fff;font-family:var(--site);-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
a{color:inherit;text-decoration:none}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;opacity:0;transition:opacity 1.6s ease}
html.ready #gl{opacity:1;transition:opacity .75s ease}
/* The landing: NASA's illustration of a quasar, its dusty torus and its clumpy outflow (see the credit), built into the 3D scene as a surface with
   relief (see `quasar` in the script), not laid over it as a picture. */
#credit{position:fixed;right:26px;bottom:20px;z-index:3;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.42);opacity:0;pointer-events:none;transition:opacity .6s ease,color .2s}
html.ready.plate-on #credit{opacity:1;pointer-events:auto}
#credit:hover,#credit:focus-visible{color:#fff;outline:none}
#cue{z-index:2}
html.nogl #credit{display:none}
/* Dots down the right-hand side: one for each project. Clicking one goes straight there, with no flight: the picture dips to black for a moment
   and comes back at that project. (Scrolling still flies there through the cloud.) */
#stops{transition:opacity .55s ease}
html.jump #gl,html.jump #stops,html.jump #title{opacity:0!important;transition:opacity .26s ease}
html.leave body{opacity:0;transition:opacity .3s ease}   /* leaving for the main page (Back, or a project's own screen): dim out first */
#dots{position:fixed;right:26px;top:50%;transform:translateY(-50%);z-index:5;display:flex;flex-direction:column;gap:2px;opacity:0;transition:opacity .8s}
html.ready #dots{opacity:1}
html.nogl #dots{display:none}
#dots button{position:relative;width:30px;height:30px;padding:0;border:0;background:none;cursor:pointer;display:flex;align-items:center;justify-content:center}
#dots button::before{content:"";width:7px;height:7px;border-radius:50%;border:1px solid rgba(255,255,255,.6);box-sizing:border-box;transition:transform .3s,background .3s,border-color .3s}
#dots button:hover::before,#dots button:focus-visible::before{border-color:#fff;transform:scale(1.35)}
#dots button.on::before{background:#fff;border-color:#fff;transform:scale(1.5)}
#dots button:focus-visible{outline:1px solid rgba(255,255,255,.6);outline-offset:-4px;border-radius:50%}
#dots button span{position:absolute;right:34px;top:50%;transform:translateY(-50%) translateX(6px);white-space:nowrap;font-size:11px;letter-spacing:.2em;text-transform:uppercase;font-weight:500;color:rgba(255,255,255,.9);text-shadow:0 0 12px rgba(3,2,8,.95),0 0 4px rgba(3,2,8,.8);opacity:0;pointer-events:none;transition:opacity .25s,transform .25s}
#dots button:hover span,#dots button:focus-visible span{opacity:1;transform:translateY(-50%)}
@media (max-width:760px){#dots{right:6px}#dots button span{display:none}}
#spacer{display:none}
/* The page does not scroll. One scroll gesture (or key, or swipe) means "next project" or "previous project", and the camera then flies there by itself. */
html:not(.nogl),html:not(.nogl) body{height:100%;overflow:hidden;overscroll-behavior:none;touch-action:none}
#pos{position:fixed;left:26px;bottom:26px;z-index:5;font-size:11px;letter-spacing:.24em;text-transform:uppercase;font-weight:500;color:rgba(255,255,255,.55);font-variant-numeric:tabular-nums;opacity:0;transition:opacity .6s;pointer-events:none}
#pos.on{opacity:1}
html.nogl #pos{display:none}

.back{position:fixed;left:26px;top:24px;z-index:5;font-size:11px;letter-spacing:.2em;text-transform:uppercase;font-weight:600;color:rgba(255,255,255,.88);border:1px solid rgba(244,239,230,.34);border-radius:99px;padding:9px 15px;background:rgba(0,0,0,.4);transition:background .25s,color .25s,border-color .25s}
.back:hover,.back:focus-visible{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.6);color:#fff;outline:none}
/* the music's button (the music itself is in ../sound.js, shared with the main page): the same pill as Back, at the other corner */
#sound{position:fixed;right:26px;top:24px;z-index:5;display:flex;align-items:center;gap:9px;font:600 11px var(--site);letter-spacing:.2em;text-transform:uppercase;color:rgba(255,255,255,.88);border:1px solid rgba(244,239,230,.34);border-radius:99px;padding:9px 15px;background:rgba(0,0,0,.4);cursor:pointer;white-space:nowrap;transition:background .25s,color .25s,border-color .25s}
#sound:hover,#sound:focus-visible{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.6);color:#fff;outline:none}
#sound .eq{display:flex;gap:2px;align-items:flex-end;height:10px}
#sound .eq b{width:2px;height:3px;background:currentColor;display:block}
#sound[aria-pressed="true"]{color:#ffb24a;border-color:rgba(255,178,74,.5)}
#sound[aria-pressed="true"] .eq b{animation:eq .9s ease-in-out infinite alternate}
#sound .eq b:nth-child(2){animation-delay:.2s}#sound .eq b:nth-child(3){animation-delay:.45s}
@keyframes eq{to{height:10px}}
@media (prefers-reduced-motion:reduce){#sound .eq b{animation:none!important}}

#title{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;pointer-events:none;z-index:2}
#title h1{margin:0;font-family:var(--serif);font-weight:400;font-size:clamp(3rem,min(6.6vw,14vh),6.6rem);line-height:1.04;letter-spacing:-.012em;color:#f5f5f5;text-shadow:0 0 34px rgba(3,2,8,.9)}
#title h1::after{content:"";display:block;width:44px;height:1px;background:rgba(255,255,255,.34);margin:22px auto 0}
#cue{position:fixed;left:0;right:0;bottom:9vh;display:flex;flex-direction:column;align-items:center;gap:12px;font-size:11px;letter-spacing:.32em;text-transform:uppercase;font-weight:500;color:rgba(255,255,255,.6);pointer-events:none;z-index:2;padding-left:.32em}
#cue::after{content:"";width:1px;height:34px;background:linear-gradient(rgba(255,255,255,.7),rgba(255,255,255,0))}

.stop{position:fixed;z-index:3;left:8vw;top:50%;transform:translateY(-50%);width:min(42vw,780px);opacity:0;visibility:hidden;text-shadow:0 0 26px rgba(3,2,8,.95),0 0 8px rgba(3,2,8,.6)}
.stop .n{display:block;font-size:clamp(11px,min(.85vw,2vh),13px);letter-spacing:.32em;text-transform:uppercase;font-weight:500;color:rgba(255,255,255,.55);margin:0 0 clamp(14px,2.8vh,28px)}
.stop h2{margin:0;font-family:var(--serif);font-weight:400;font-size:clamp(2.1rem,min(4.7vw,10vh),5.4rem);line-height:1.06;letter-spacing:-.012em;color:#f5f5f5}
.stop h2::after{content:"";display:block;width:52px;height:1px;background:rgba(255,255,255,.34);margin:clamp(16px,3.2vh,32px) 0 0}
.stop p{margin:clamp(14px,3vh,30px) 0 0;font-size:clamp(1.02rem,min(1.5vw,3.5vh),1.5rem);line-height:1.55;font-weight:400;color:rgba(255,255,255,.72);max-width:30em}
.stop .go{display:inline-flex;align-items:center;gap:12px;margin-top:clamp(18px,3.8vh,40px);font-size:clamp(11px,min(.92vw,2.2vh),14px);letter-spacing:.2em;text-transform:uppercase;font-weight:500;color:#fff;border:1px solid rgba(255,255,255,.34);border-radius:99px;padding:1.15em 1.9em;background:rgba(255,255,255,.04);text-shadow:none;transition:background .3s,border-color .3s,gap .3s}
.stop .go:hover,.stop .go:focus-visible{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.7);gap:17px;outline:none}

@media (max-width:760px){
  .back{left:16px;top:16px}
  #sound{right:16px;top:16px;padding:8px 12px;font-size:10px}
  .stop{left:22px;right:22px;width:auto;top:auto;bottom:8vh;transform:none}
  .stop .n{margin-bottom:14px} .stop h2::after{margin-top:16px} .stop p{margin-top:14px} .stop .go{margin-top:20px}
}
/* without WebGL 2 the projects are simply a list */
html.nogl #gl,html.nogl #spacer,html.nogl #cue{display:none}
html.nogl #title{position:static;padding:22vh 0 8vh}
html.nogl .stop{position:static;transform:none;opacity:1!important;visibility:visible!important;width:auto;max-width:560px;margin:0 auto;padding:7vh 24px}
</style>
</head>

<canvas id="gl" aria-hidden="true"></canvas>

<header id="title"><h1>Projects</h1></header>

<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';

/* ───────── the six projects ───────── */
const PROJECTS = [
  ['quantumviz', 'QuantumViz', 'AI-powered quantum circuit generator using natural language and 3D visualization'],
  ['ai-engineering-deloitte', 'Generative AI for Code & Data', 'GPT-powered coding assistant and natural language data analysis platform at Deloitte'],
  ['actuals', 'AI for SMB Acquisitions', 'Founding Engineer at an AI startup streamlining business acquisitions'],
  ['drone-ndvi', 'Drone-Mounted IR System for Vegetation Monitoring', 'Enhancing environmental monitoring using drone technology'],
  ['satellite-fire', 'Satellite-Based Fire Detection', 'Visualizing fire, water, and land cover using Copernicus data from ESA'],
  ['lattice-boltzmann', 'Lattice Boltzmann Fluid Simulation', 'Computational fluid dynamics simulation of flow past a cylinder using the LBM method'],
];
const root = document.documentElement, $ = (s) => document.querySelector(s);
/* Leaving the landing, the camera flies into the cloud as it does between any two stops, and the landing's picture goes with it: the view steers in on
   the thick of the picture's clouds and pushes into them until they fill the screen, and as it does the picture thins away into the real gas the camera
   is by then flying through. All of it is set by how far along the flight is (s: 0 at the title, 1 at the first project), not by a clock, so it runs
   backwards exactly on the way back, and stops where the flight stops. */
// Links to the main page (Back, and each star's "View project"): the picture dims out before the page changes.
const leaveTo = (url) => { if (matchMedia('(prefers-reduced-motion: reduce)').matches) { location.href = url; return; } root.classList.add('leave'); setTimeout(() => { location.href = url; }, 300); };
addEventListener('pageshow', (e) => { if (e.persisted) root.classList.remove('leave'); });
addEventListener('click', (e) => { const a = e.target.closest && e.target.closest('a.back, a.go'); if (!a || e.metaKey || e.ctrlKey || e.shiftKey || e.button) return; e.preventDefault(); leaveTo(a.href); });
const stopEls = PROJECTS.map(([id, title, sum], i) => {
  const el = document.createElement('section'); el.className = 'stop'; el.setAttribute('aria-hidden', 'true');
  const n = document.createElement('span'); n.className = 'n'; n.textContent = String(i + 1).padStart(2, '0');
  const h = document.createElement('h2'); h.textContent = title;
  const p = document.createElement('p'); p.textContent = sum;
  const a = document.createElement('a'); a.className = 'go'; a.href = '../?project=' + id; a.innerHTML = 'View project <span aria-hidden="true">&rarr;</span>'; a.tabIndex = -1;
  a.addEventListener('focus', () => { goTo(i + 1); });
  el.append(n, h, p, a); $('#stops').append(el); return el;
});
const titleEl = $('#title'), cueEl = $('#cue');
const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
const scrollMax = () => Math.max(1, document.documentElement.scrollHeight - innerHeight);
// Where the visitor has asked to be: 0 the title, 1 to 6 the six projects. The frame loop flies the camera there at its own unhurried pace (see
// vmax in frame()); sLive is where the camera actually is on the way.
// Which star the page opens at: the title, unless the address names a project (…/projects-3/#satellite-fire). The address follows the visitor from star
// to star, so coming back from a project's screen returns to the same star. A reload is different: it starts the page again from its title.
const RELOADED = ((performance.getEntriesByType && performance.getEntriesByType('navigation')[0]) || {}).type === 'reload';
if (RELOADED && location.hash) { try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {} }
let stopAt = RELOADED ? 0 : PROJECTS.findIndex(([id]) => '#' + id === location.hash) + 1, sLive = stopAt;
root.classList.toggle('at-title', stopAt === 0);   // (the landing's picture shows only while the page is at its title)
const scrollS = () => stopAt;
const posEl = document.getElementById('pos');
let snapReq = false, jumpT = 0;
const dotEls = PROJECTS.map(([id, title], i) => { const b = document.createElement('button'); b.type = 'button'; b.setAttribute('aria-label', 'Go to project ' + (i + 1) + ': ' + title);
  const sp = document.createElement('span'); sp.textContent = String(i + 1).padStart(2, '0') + ' \u00a0 ' + title; b.append(sp); b.addEventListener('click', () => jumpTo(i + 1)); document.getElementById('dots').append(b); return b; });
const showPos = () => { root.classList.toggle('at-title', stopAt === 0); posEl.textContent = stopAt ? String(stopAt).padStart(2, '0') + ' / 06' : ''; posEl.classList.toggle('on', stopAt > 0); dotEls.forEach((b, i) => { b.classList.toggle('on', i + 1 === stopAt); b.setAttribute('aria-current', i + 1 === stopAt ? 'true' : 'false'); });
  try { history.replaceState(null, '', stopAt ? '#' + PROJECTS[stopAt - 1][0] : location.pathname + location.search); } catch (e) {} };
if (stopAt) showPos();
// Straight to a project, with no flight: dip to black, put the camera there, come back.
function jumpTo(n) { if (n === stopAt && Math.abs(stopAt - sLive) < 0.05) return; const root = document.documentElement; clearTimeout(jumpT); root.classList.add('jump');
  jumpT = setTimeout(() => { stopAt = n; snapReq = true; showPos(); jumpT = setTimeout(() => root.classList.remove('jump'), 420); }, 270); }
function goTo(n) { n = Math.min(6, Math.max(0, n)); if (n !== stopAt) { stopAt = n; showPos(); } }
function step(dir) { const gap = stopAt - sLive; if (Math.abs(gap) > 0.3) {   /* once it is most of the way there the next step is accepted, so the long settle at the end never leaves the visitor waiting */ if (Math.sign(gap) === dir) return; goTo(dir > 0 ? Math.ceil(sLive - 1e-3) : Math.floor(sLive + 1e-3)); } else goTo(stopAt + dir); }
{ let lastWheel = 0, armed = true;                             // a gesture is the first wheel event after a pause; only that can start a step
  addEventListener('wheel', (e) => { if (document.documentElement.classList.contains('nogl')) return; e.preventDefault(); const now = performance.now(); if (now - lastWheel > 160) armed = true; lastWheel = now;
    const d = Math.abs(e.deltaY) >= Math.abs(e.deltaX) ? e.deltaY : e.deltaX; if (armed && Math.abs(d) >= 2) { armed = false; step(d > 0 ? 1 : -1); } }, { passive: false });
  addEventListener('keydown', (e) => { if (e.metaKey || e.ctrlKey || e.altKey || document.documentElement.classList.contains('nogl')) return; const k = e.key;
    const dir = k === 'ArrowDown' || k === 'PageDown' || (k === ' ' && !e.shiftKey) || k === 'ArrowRight' ? 1 : k === 'ArrowUp' || k === 'PageUp' || (k === ' ' && e.shiftKey) || k === 'ArrowLeft' ? -1 : 0;
    if (dir) { e.preventDefault(); step(dir); } else if (k === 'Home') { e.preventDefault(); goTo(0); } else if (k === 'End') { e.preventDefault(); goTo(6); } });
  let ty = null; addEventListener('touchstart', (e) => { ty = e.touches[0].clientY; }, { passive: true });
  addEventListener('touchend', (e) => { if (ty == null) return; const dy = ty - e.changedTouches[0].clientY; ty = null; if (Math.abs(dy) > 36) step(dy > 0 ? 1 : -1); }, { passive: true }); }
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const sst = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };

/* what is on screen, as a function of how far the page has travelled. One project at a time: each is gone before the next begins. */
function layout(s) {
  const tk = 1 - sst(0.04, 0.3, s); titleEl.style.opacity = tk; titleEl.style.visibility = tk > 0.003 ? 'visible' : 'hidden';
  cueEl.style.opacity = 1 - sst(0.01, 0.12, s);
  stopEls.forEach((el, i) => { const d = Math.abs(s - (i + 1)); const k = 1 - sst(0.15, 0.33, d), on = k > 0.003;
    el.style.opacity = k; el.style.visibility = on ? 'visible' : 'hidden'; if (!RM) el.style.transform = (innerWidth > 760 ? 'translateY(-50%) ' : '') + 'translateY(' + ((s - (i + 1)) * -26).toFixed(2) + 'px)';
    el.style.pointerEvents = k > 0.6 ? 'auto' : 'none'; el.setAttribute('aria-hidden', on ? 'false' : 'true'); el.lastChild.tabIndex = 0; });
}

let renderer = null;
try { renderer = new THREE.WebGLRenderer({ canvas: $('#gl'), antialias: false, powerPreference: 'high-performance' }); if (!renderer.capabilities.isWebGL2 || !renderer.getContext().getExtension('EXT_color_buffer_float')) renderer = null; }
catch (err) { renderer = null; }
if (!renderer) root.classList.add('nogl'); else boot();

function boot() {
  const DPR = Math.min(window.devicePixelRatio || 1, 2);
  const SMALL = Math.min(innerWidth, innerHeight) < 600;
  renderer.setPixelRatio(DPR); renderer.setSize(innerWidth, innerHeight, false);
  renderer.toneMapping = THREE.NoToneMapping; renderer.setClearColor(0x000000, 1);
  const gl = renderer.getContext();
  const quadGeo = new THREE.PlaneGeometry(2, 2), flatCam = new THREE.Camera();
  const VS = `out vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position.xy,0.0,1.0); }`;
  function mkPass(fs, uniforms, extra) { const m = new THREE.ShaderMaterial(Object.assign({ uniforms, vertexShader: VS, fragmentShader: fs, glslVersion: THREE.GLSL3, depthTest: false, depthWrite: false }, extra || {}));
    const sc = new THREE.Scene(), q = new THREE.Mesh(quadGeo, m); q.frustumCulled = false; sc.add(q); return { sc, m, u: uniforms }; }
  function run(p, target, layer) { renderer.setRenderTarget(target, layer || 0); renderer.render(p.sc, flatCam); }

  /* ════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════
     THE CLOUD
     One star-forming cloud, about ninety light-years long (one unit here is roughly one light-year: the Eagle's pillars are four or five long,
     the Orion Nebula about twenty-four across), with six young stars inside it, fourteen units apart. The camera flies its length.
     It is a real volume, marched through along every line of sight, and what it looks like follows from what is known of such clouds:

       · Density is turbulent. Supersonic turbulence gives gas a lognormal spread of densities (most of the volume thin, most of the mass in
         knots, sheets and filaments), so the density is the exponential of a fractal noise field. The noise is kept in a tiling 64³ texture
         (three octaves of gradient noise per channel, one channel ridged for sheets) and read at three scales, nine octaves in all.

       · A hot star (hotter than about 25,000 K: types O and early B) ionises hydrogen round itself, and only so much of it: every
         recombination uses up one of its ionising photons, and recombinations go as density SQUARED. So along every direction out from the star
         the gas is ionised until the sum of density² · r² dr reaches the star's budget (the Strömgren condition), and no further. That one
         rule gives the real shapes: the star eats far into thin gas and is stopped at once by a dense knot; behind the knot the gas is in
         shadow and stays neutral, so dense gas is left standing as pillars that point at the star; and the ionised volume has a sharp edge,
         the ionisation front. This sum, and the dust's optical depth toward the star, are worked out once, when the page loads, for every
         direction and distance from each star (a 192 × 96 × 128 map per star, built outward shell by shell), so the shadows run all the way
         to the star, not one short step.

       · Ionised gas glows by recombination, as density squared. Gas inside the front has been heated to ten thousand degrees and has expanded
         and thinned, so the interior is a faint haze; gas just inside the front is fresh off the dense cloud and still dense, so the front
         itself is a bright rim on whatever dense gas faces the star. Its brightness is limited by the star's flux there (weaker further out).
         Colour: each of the six clouds is shown in a palette of its own (see PAL), the way narrow-band pictures of nebulae are (the
         same glowing gas mapped to a chosen set of colours: Hubble's gold-and-teal Eagle is one such), so that no two projects look alike.
         Within each, the glow is deeper in colour out at the front and paler and brighter in toward the star, as the real zones are (hydrogen's
         and nitrogen's lines at the front, doubly ionised oxygen's in the hot inner zone). Only the last cloud is in natural colour: a very hot
         star's nebula, mostly oxygen's teal.

       · Dust scatters the star's light, forwards more than back, and blue more than red. Round a star too cool to ionise hydrogen that
         scattered light is all there is: a reflection nebula, bluer than its star. Round a cool, still-embedded star the same thing is amber.

       · Dust in front dims and reddens whatever is behind it (blue lost faster than red): the near parts of the cloud stand black against
         the glow, and a star seen through dust is a dim red point long before the camera breaks through to it.

     Departures from the real thing are noted where they are made; the main ones: the star's light is scattered once (plus a small
     allowance for the rest); the ionised gas is thinned, and the gas ahead of the front piled up, by a fixed rule rather than by following
     the flow; the ionising budget is counted against the cloud's broad structure and the front then placed by the fine structure, which
     is a shortcut; the colours of the emission lines are mixed by eye within what the lines allow, not computed from a spectrum; a dark
     cloud has been put where each stop's words go; nothing moves (a cloud like this changes over tens of thousands of years); and the six
     stars are far closer together, and the camera far faster, than anything real.
     ════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════ */
  const D = 14;                                             // distance between one star and the next
  const FOV = SMALL ? 62 : 50, TAN_REF = Math.tan(FOV * Math.PI / 360), ASP_REF = 16 / 9;
  const tanFor = (aspect) => aspect > ASP_REF ? TAN_REF * ASP_REF / aspect : TAN_REF;   // a window wider than 16:9 sees no further to the sides than a 16:9 one does: it is the same picture with the top and bottom cropped, not a wider and wider lens
  const O6 = [0.33, 0.50, 1.0], O9 = [0.37, 0.53, 1.0], B3 = [0.42, 0.58, 1.0], K4 = [1.0, 0.64, 0.36];   // star colours: black bodies at about 40,000 K, 33,000 K, 18,000 K and 4,000 K

  /* ── the gas moves ──

     gas shears, folds and billows and never comes back to quite the same shape. (Real clouds like this are turbulent and are being pushed about
     by their stars; the real thing takes thousands of years, and this is that, greatly sped up.) It is done by moving the place each bit of
     gas is looked up from, so everything belonging to the gas, coarse and fine, moves together and nothing slides over anything else.
     The picture is built up over many frames (see below), which only works if the renderer knows where the gas it drew a moment ago has got
     to. Because the flow is a known formula, it does: flowAt is used again there, so the picture stays sharp while the gas moves.
     What does not follow the flow: the stars' shadow and ionisation maps, which are worked out once when the page loads. The flow is kept
