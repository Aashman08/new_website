<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Projects</title>
<meta name="theme-color" content="#030208">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
<style>
:root{--bg:#030208;--site:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;--serif:"Playfair Display",Georgia,serif}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:#fff;font-family:var(--site);-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
a{color:inherit;text-decoration:none}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;opacity:0;transition:opacity 1.6s ease}
html.ready #gl{opacity:1;transition:opacity .75s ease}
/* The landing's picture: NASA's illustration of a quasar, its dusty torus and its clumpy outflow (see the credit), shown as it is but for the two
   reflections of the camera's lens that were painted into it (the pale discs above the torus and on its near wall), which are retouched out. It sits over the
   3D scene while the page is at its title, with the torus where each project's star will be (right of centre) so the title stays clear of it.
   Leaving the title, the view pushes into the quasar's light and the picture gives way to the flight through the cloud. */
#plate{position:fixed;inset:0;z-index:1;pointer-events:none;overflow:hidden;opacity:0;transform-origin:64.9% 36%;will-change:transform,opacity}   /* (the point the view steers in on: the thick of the clouds, up and to the left of the torus) */
html:not(.ready) #plate{opacity:0!important}
html.ready #plate{animation:platein 1s ease}
@keyframes platein{from{opacity:0}}
html.jump #plate{opacity:0!important}
#plate .pl{position:absolute;left:70%;top:52%;width:118vh;height:118vh;transform:translate(-47.5%,-56.5%)}
#plate img{-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 14%,#000 93%,transparent 100%);mask-image:linear-gradient(90deg,transparent 0,#000 14%,#000 93%,transparent 100%)}   /* (the picture's edges fade out to either side; the moving version does the same for itself) */
#plate img,#plate canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#plate canvas{opacity:0;transition:opacity .6s ease}
#plate canvas.on{opacity:1}
#credit{position:fixed;right:26px;bottom:20px;z-index:3;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.42);opacity:0;pointer-events:none;transition:opacity .6s ease,color .2s}
html.ready.plate-on #credit{opacity:1;pointer-events:auto}
#credit:hover,#credit:focus-visible{color:#fff;outline:none}
#cue{z-index:2}
html.nogl #plate,html.nogl #credit{display:none}
@media (max-aspect-ratio:1/1){ #plate{transform-origin:42% 30%} #plate .pl{left:50%;top:42%;width:130vw;height:130vw} }   /* on a tall screen the picture is fitted to the width, with the torus above the title */
/* Dots down the right-hand side: one for each project. Clicking one goes straight there, with no flight: the picture dips to black for a moment
   and comes back at that project. (Scrolling still flies there through the cloud.) */
#stops{transition:opacity .55s ease}
html.jump #gl,html.jump #stops,html.jump #title{opacity:0!important;transition:opacity .26s ease}
html.leave body{opacity:0;transition:opacity .3s ease}   /* leaving for the main page (Back, or a project's own screen): dim out first */
#dots{position:fixed;right:26px;top:50%;transform:translateY(-50%);z-index:5;display:flex;flex-direction:column;gap:2px;opacity:0;transition:opacity .8s}
html.ready #dots{opacity:1}
html.nogl #dots{display:none}
#dots button{position:relative;width:30px;height:30px;padding:0;border:0;background:none;cursor:pointer;display:flex;align-items:center;justify-content:center}
#dots button::before{content:"";width:7px;height:7px;border-radius:50%;border:1px solid rgba(255,255,255,.6);box-sizing:border-box;transition:transform .3s,background .3s,border-color .3s}
#dots button:hover::before,#dots button:focus-visible::before{border-color:#fff;transform:scale(1.35)}
#dots button.on::before{background:#fff;border-color:#fff;transform:scale(1.5)}
#dots button:focus-visible{outline:1px solid rgba(255,255,255,.6);outline-offset:-4px;border-radius:50%}
#dots button span{position:absolute;right:34px;top:50%;transform:translateY(-50%) translateX(6px);white-space:nowrap;font-size:11px;letter-spacing:.2em;text-transform:uppercase;font-weight:500;color:rgba(255,255,255,.9);text-shadow:0 0 12px rgba(3,2,8,.95),0 0 4px rgba(3,2,8,.8);opacity:0;pointer-events:none;transition:opacity .25s,transform .25s}
#dots button:hover span,#dots button:focus-visible span{opacity:1;transform:translateY(-50%)}
@media (max-width:760px){#dots{right:6px}#dots button span{display:none}}
#spacer{display:none}
/* The page does not scroll. One scroll gesture (or key, or swipe) means "next project" or "previous project", and the camera then flies there by itself. */
html:not(.nogl),html:not(.nogl) body{height:100%;overflow:hidden;overscroll-behavior:none;touch-action:none}
#pos{position:fixed;left:26px;bottom:26px;z-index:5;font-size:11px;letter-spacing:.24em;text-transform:uppercase;font-weight:500;color:rgba(255,255,255,.55);font-variant-numeric:tabular-nums;opacity:0;transition:opacity .6s;pointer-events:none}
#pos.on{opacity:1}
html.nogl #pos{display:none}

.back{position:fixed;left:26px;top:24px;z-index:5;font-size:11px;letter-spacing:.2em;text-transform:uppercase;font-weight:600;color:rgba(255,255,255,.88);border:1px solid rgba(244,239,230,.34);border-radius:99px;padding:9px 15px;background:rgba(0,0,0,.4);transition:background .25s,color .25s,border-color .25s}
.back:hover,.back:focus-visible{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.6);color:#fff;outline:none}
/* the music's button (the music itself is in ../sound.js, shared with the main page): the same pill as Back, at the other corner */
#sound{position:fixed;right:26px;top:24px;z-index:5;display:flex;align-items:center;gap:9px;font:600 11px var(--site);letter-spacing:.2em;text-transform:uppercase;color:rgba(255,255,255,.88);border:1px solid rgba(244,239,230,.34);border-radius:99px;padding:9px 15px;background:rgba(0,0,0,.4);cursor:pointer;white-space:nowrap;transition:background .25s,color .25s,border-color .25s}
#sound:hover,#sound:focus-visible{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.6);color:#fff;outline:none}
#sound .eq{display:flex;gap:2px;align-items:flex-end;height:10px}
#sound .eq b{width:2px;height:3px;background:currentColor;display:block}
#sound[aria-pressed="true"]{color:#ffb24a;border-color:rgba(255,178,74,.5)}
#sound[aria-pressed="true"] .eq b{animation:eq .9s ease-in-out infinite alternate}
#sound .eq b:nth-child(2){animation-delay:.2s}#sound .eq b:nth-child(3){animation-delay:.45s}
@keyframes eq{to{height:10px}}
@media (prefers-reduced-motion:reduce){#sound .eq b{animation:none!important}}

#title{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;pointer-events:none;z-index:2}
#title h1{margin:0;font-family:var(--serif);font-weight:400;font-size:clamp(3rem,min(6.6vw,14vh),6.6rem);line-height:1.04;letter-spacing:-.012em;color:#f5f5f5;text-shadow:0 0 34px rgba(3,2,8,.9)}
#title h1::after{content:"";display:block;width:44px;height:1px;background:rgba(255,255,255,.34);margin:22px auto 0}
#cue{position:fixed;left:0;right:0;bottom:9vh;display:flex;flex-direction:column;align-items:center;gap:12px;font-size:11px;letter-spacing:.32em;text-transform:uppercase;font-weight:500;color:rgba(255,255,255,.6);pointer-events:none;z-index:2;padding-left:.32em}
#cue::after{content:"";width:1px;height:34px;background:linear-gradient(rgba(255,255,255,.7),rgba(255,255,255,0))}

.stop{position:fixed;z-index:3;left:8vw;top:50%;transform:translateY(-50%);width:min(42vw,780px);opacity:0;visibility:hidden;text-shadow:0 0 26px rgba(3,2,8,.95),0 0 8px rgba(3,2,8,.6)}
.stop .n{display:block;font-size:clamp(11px,min(.85vw,2vh),13px);letter-spacing:.32em;text-transform:uppercase;font-weight:500;color:rgba(255,255,255,.55);margin:0 0 clamp(14px,2.8vh,28px)}
.stop h2{margin:0;font-family:var(--serif);font-weight:400;font-size:clamp(2.1rem,min(4.7vw,10vh),5.4rem);line-height:1.06;letter-spacing:-.012em;color:#f5f5f5}
.stop h2::after{content:"";display:block;width:52px;height:1px;background:rgba(255,255,255,.34);margin:clamp(16px,3.2vh,32px) 0 0}
.stop p{margin:clamp(14px,3vh,30px) 0 0;font-size:clamp(1.02rem,min(1.5vw,3.5vh),1.5rem);line-height:1.55;font-weight:400;color:rgba(255,255,255,.72);max-width:30em}
.stop .go{display:inline-flex;align-items:center;gap:12px;margin-top:clamp(18px,3.8vh,40px);font-size:clamp(11px,min(.92vw,2.2vh),14px);letter-spacing:.2em;text-transform:uppercase;font-weight:500;color:#fff;border:1px solid rgba(255,255,255,.34);border-radius:99px;padding:1.15em 1.9em;background:rgba(255,255,255,.04);text-shadow:none;transition:background .3s,border-color .3s,gap .3s}
.stop .go:hover,.stop .go:focus-visible{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.7);gap:17px;outline:none}

@media (max-width:760px){
  .back{left:16px;top:16px}
  #sound{right:16px;top:16px;padding:8px 12px;font-size:10px}
  .stop{left:22px;right:22px;width:auto;top:auto;bottom:8vh;transform:none}
  .stop .n{margin-bottom:14px} .stop h2::after{margin-top:16px} .stop p{margin-top:14px} .stop .go{margin-top:20px}
}
/* without WebGL 2 the projects are simply a list */
html.nogl #gl,html.nogl #spacer,html.nogl #cue{display:none}
html.nogl #title{position:static;padding:22vh 0 8vh}
html.nogl .stop{position:static;transform:none;opacity:1!important;visibility:visible!important;width:auto;max-width:560px;margin:0 auto;padding:7vh 24px}
</style>

<canvas id="gl" aria-hidden="true"></canvas>
<div id="plate" aria-hidden="true"><div class="pl"><img src="img/quasar-clouds.jpg" alt="" decoding="async"><canvas></canvas></div></div>

<button type="button" id="sound" aria-pressed="false" aria-label="Toggle music"><span class="eq" aria-hidden="true"><b></b><b></b><b></b></span><span id="sound-t">Sound off</span></button>

<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';

/* ───────── the six projects ───────── */
const PROJECTS = [
  ['quantumviz', 'QuantumViz', 'AI-powered quantum circuit generator using natural language and 3D visualization'],
  ['ai-engineering-deloitte', 'Generative AI for Code & Data', 'GPT-powered coding assistant and natural language data analysis platform at Deloitte'],
  ['actuals', 'AI for SMB Acquisitions', 'Founding Engineer at an AI startup streamlining business acquisitions'],
  ['drone-ndvi', 'Drone-Mounted IR System for Vegetation Monitoring', 'Enhancing environmental monitoring using drone technology'],
  ['satellite-fire', 'Satellite-Based Fire Detection', 'Visualizing fire, water, and land cover using Copernicus data from ESA'],
  ['lattice-boltzmann', 'Lattice Boltzmann Fluid Simulation', 'Computational fluid dynamics simulation of flow past a cylinder using the LBM method'],
];
const root = document.documentElement, $ = (s) => document.querySelector(s);
/* Leaving the landing, the camera flies into the cloud as it does between any two stops, and the landing's picture goes with it: the view steers in on
   the thick of the picture's clouds and pushes into them until they fill the screen, and as it does the picture thins away into the real gas the camera
   is by then flying through. All of it is set by how far along the flight is (s: 0 at the title, 1 at the first project), not by a clock, so it runs
   backwards exactly on the way back, and stops where the flight stops. */
const plateEl = document.getElementById('plate'); let plateOp = -1;
function plateAt(s) { const k = Math.min(1, Math.max(0, s)), e = (a, b) => { const t = Math.min(1, Math.max(0, (k - a) / (b - a))); return t * t * (3 - 2 * t); };
  const op = 1 - e(0.26, 0.64, k), z = e(0.0, 0.70, k); if (op === plateOp && (op === 0 || k === 0)) return; plateOp = op;
  plateEl.style.opacity = op.toFixed(3); plateEl.style.visibility = op > 0 ? 'visible' : 'hidden'; root.classList.toggle('plate-on', op > 0.7 && k < 0.2);   // (plate-on: the picture is up and near enough whole for its credit to be shown with it)
  plateEl.style.transform = k > 0 && op > 0 ? 'translate(' + (-14.9 * z).toFixed(2) + 'vw,' + (14 * z).toFixed(2) + 'vh) scale(' + (1 + 3.2 * z * z).toFixed(3) + ')' : 'none'; }
// Links to the main page (Back, and each star's "View project"): the picture dims out before the page changes.
const leaveTo = (url) => { if (matchMedia('(prefers-reduced-motion: reduce)').matches) { location.href = url; return; } root.classList.add('leave'); setTimeout(() => { location.href = url; }, 300); };
addEventListener('pageshow', (e) => { if (e.persisted) root.classList.remove('leave'); });
addEventListener('click', (e) => { const a = e.target.closest && e.target.closest('a.back, a.go'); if (!a || e.metaKey || e.ctrlKey || e.shiftKey || e.button) return; e.preventDefault(); leaveTo(a.href); });
const stopEls = PROJECTS.map(([id, title, sum], i) => {
  const el = document.createElement('section'); el.className = 'stop'; el.setAttribute('aria-hidden', 'true');
  const n = document.createElement('span'); n.className = 'n'; n.textContent = String(i + 1).padStart(2, '0');
  const h = document.createElement('h2'); h.textContent = title;
  const p = document.createElement('p'); p.textContent = sum;
  const a = document.createElement('a'); a.className = 'go'; a.href = '../?project=' + id; a.innerHTML = 'View project <span aria-hidden="true">&rarr;</span>'; a.tabIndex = -1;
  a.addEventListener('focus', () => { goTo(i + 1); });
  el.append(n, h, p, a); $('#stops').append(el); return el;
});
const titleEl = $('#title'), cueEl = $('#cue');
const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
const scrollMax = () => Math.max(1, document.documentElement.scrollHeight - innerHeight);
// Where the visitor has asked to be: 0 the title, 1 to 6 the six projects. The frame loop flies the camera there at its own unhurried pace (see
// vmax in frame()); sLive is where the camera actually is on the way.
// Which star the page opens at: the title, unless the address names a project (…/projects-3/#satellite-fire). The address follows the visitor from star
// to star, so coming back from a project's screen returns to the same star. A reload is different: it starts the page again from its title.
const RELOADED = ((performance.getEntriesByType && performance.getEntriesByType('navigation')[0]) || {}).type === 'reload';
if (RELOADED && location.hash) { try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {} }
let stopAt = RELOADED ? 0 : PROJECTS.findIndex(([id]) => '#' + id === location.hash) + 1, sLive = stopAt;
root.classList.toggle('at-title', stopAt === 0);   // (the landing's picture shows only while the page is at its title)
const scrollS = () => stopAt;
const posEl = document.getElementById('pos');
let snapReq = false, jumpT = 0;
const dotEls = PROJECTS.map(([id, title], i) => { const b = document.createElement('button'); b.type = 'button'; b.setAttribute('aria-label', 'Go to project ' + (i + 1) + ': ' + title);
  const sp = document.createElement('span'); sp.textContent = String(i + 1).padStart(2, '0') + ' \u00a0 ' + title; b.append(sp); b.addEventListener('click', () => jumpTo(i + 1)); document.getElementById('dots').append(b); return b; });
const showPos = () => { root.classList.toggle('at-title', stopAt === 0); posEl.textContent = stopAt ? String(stopAt).padStart(2, '0') + ' / 06' : ''; posEl.classList.toggle('on', stopAt > 0); dotEls.forEach((b, i) => { b.classList.toggle('on', i + 1 === stopAt); b.setAttribute('aria-current', i + 1 === stopAt ? 'true' : 'false'); });
  try { history.replaceState(null, '', stopAt ? '#' + PROJECTS[stopAt - 1][0] : location.pathname + location.search); } catch (e) {} };
if (stopAt) showPos();
// Straight to a project, with no flight: dip to black, put the camera there, come back.
function jumpTo(n) { if (n === stopAt && Math.abs(stopAt - sLive) < 0.05) return; const root = document.documentElement; clearTimeout(jumpT); root.classList.add('jump');
  jumpT = setTimeout(() => { stopAt = n; snapReq = true; showPos(); jumpT = setTimeout(() => root.classList.remove('jump'), 420); }, 270); }
function goTo(n) { n = Math.min(6, Math.max(0, n)); if (n !== stopAt) { stopAt = n; showPos(); } }
function step(dir) { const gap = stopAt - sLive; if (Math.abs(gap) > 0.3) {   /* once it is most of the way there the next step is accepted, so the long settle at the end never leaves the visitor waiting */ if (Math.sign(gap) === dir) return; goTo(dir > 0 ? Math.ceil(sLive - 1e-3) : Math.floor(sLive + 1e-3)); } else goTo(stopAt + dir); }
{ let lastWheel = 0, armed = true;                             // a gesture is the first wheel event after a pause; only that can start a step
  addEventListener('wheel', (e) => { if (document.documentElement.classList.contains('nogl')) return; e.preventDefault(); const now = performance.now(); if (now - lastWheel > 160) armed = true; lastWheel = now;
    const d = Math.abs(e.deltaY) >= Math.abs(e.deltaX) ? e.deltaY : e.deltaX; if (armed && Math.abs(d) >= 2) { armed = false; step(d > 0 ? 1 : -1); } }, { passive: false });
  addEventListener('keydown', (e) => { if (e.metaKey || e.ctrlKey || e.altKey || document.documentElement.classList.contains('nogl')) return; const k = e.key;
    const dir = k === 'ArrowDown' || k === 'PageDown' || (k === ' ' && !e.shiftKey) || k === 'ArrowRight' ? 1 : k === 'ArrowUp' || k === 'PageUp' || (k === ' ' && e.shiftKey) || k === 'ArrowLeft' ? -1 : 0;
    if (dir) { e.preventDefault(); step(dir); } else if (k === 'Home') { e.preventDefault(); goTo(0); } else if (k === 'End') { e.preventDefault(); goTo(6); } });
  let ty = null; addEventListener('touchstart', (e) => { ty = e.touches[0].clientY; }, { passive: true });
  addEventListener('touchend', (e) => { if (ty == null) return; const dy = ty - e.changedTouches[0].clientY; ty = null; if (Math.abs(dy) > 36) step(dy > 0 ? 1 : -1); }, { passive: true }); }
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const sst = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };

/* what is on screen, as a function of how far the page has travelled. One project at a time: each is gone before the next begins. */
function layout(s) {
  const tk = 1 - sst(0.04, 0.3, s); titleEl.style.opacity = tk; titleEl.style.visibility = tk > 0.003 ? 'visible' : 'hidden';
  cueEl.style.opacity = 1 - sst(0.01, 0.12, s);
  stopEls.forEach((el, i) => { const d = Math.abs(s - (i + 1)); const k = 1 - sst(0.15, 0.33, d), on = k > 0.003;
    el.style.opacity = k; el.style.visibility = on ? 'visible' : 'hidden'; if (!RM) el.style.transform = (innerWidth > 760 ? 'translateY(-50%) ' : '') + 'translateY(' + ((s - (i + 1)) * -26).toFixed(2) + 'px)';
    el.style.pointerEvents = k > 0.6 ? 'auto' : 'none'; el.setAttribute('aria-hidden', on ? 'false' : 'true'); el.lastChild.tabIndex = 0; });
}

let renderer = null;
try { renderer = new THREE.WebGLRenderer({ canvas: $('#gl'), antialias: false, powerPreference: 'high-performance' }); if (!renderer.capabilities.isWebGL2 || !renderer.getContext().getExtension('EXT_color_buffer_float')) renderer = null; }
catch (err) { renderer = null; }
if (!renderer) root.classList.add('nogl'); else boot();

function boot() {
  const DPR = Math.min(window.devicePixelRatio || 1, 2);
  const SMALL = Math.min(innerWidth, innerHeight) < 600;
  renderer.setPixelRatio(DPR); renderer.setSize(innerWidth, innerHeight, false);
  renderer.toneMapping = THREE.NoToneMapping; renderer.setClearColor(0x000000, 1);
  const gl = renderer.getContext();
  const quadGeo = new THREE.PlaneGeometry(2, 2), flatCam = new THREE.Camera();
  const VS = `out vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position.xy,0.0,1.0); }`;
  function mkPass(fs, uniforms, extra) { const m = new THREE.ShaderMaterial(Object.assign({ uniforms, vertexShader: VS, fragmentShader: fs, glslVersion: THREE.GLSL3, depthTest: false, depthWrite: false }, extra || {}));
    const sc = new THREE.Scene(), q = new THREE.Mesh(quadGeo, m); q.frustumCulled = false; sc.add(q); return { sc, m, u: uniforms }; }
  function run(p, target, layer) { renderer.setRenderTarget(target, layer || 0); renderer.render(p.sc, flatCam); }

  /* ════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════
     THE CLOUD
     One star-forming cloud, about ninety light-years long (one unit here is roughly one light-year: the Eagle's pillars are four or five long,
     the Orion Nebula about twenty-four across), with six young stars inside it, fourteen units apart. The camera flies its length.
     It is a real volume, marched through along every line of sight, and what it looks like follows from what is known of such clouds:

       · Density is turbulent. Supersonic turbulence gives gas a lognormal spread of densities (most of the volume thin, most of the mass in
         knots, sheets and filaments), so the density is the exponential of a fractal noise field. The noise is kept in a tiling 64³ texture
         (three octaves of gradient noise per channel, one channel ridged for sheets) and read at three scales, nine octaves in all.

       · A hot star (hotter than about 25,000 K: types O and early B) ionises hydrogen round itself, and only so much of it: every
         recombination uses up one of its ionising photons, and recombinations go as density SQUARED. So along every direction out from the star
         the gas is ionised until the sum of density² · r² dr reaches the star's budget (the Strömgren condition), and no further. That one
         rule gives the real shapes: the star eats far into thin gas and is stopped at once by a dense knot; behind the knot the gas is in
         shadow and stays neutral, so dense gas is left standing as pillars that point at the star; and the ionised volume has a sharp edge,
         the ionisation front. This sum, and the dust's optical depth toward the star, are worked out once, when the page loads, for every
         direction and distance from each star (a 192 × 96 × 128 map per star, built outward shell by shell), so the shadows run all the way
         to the star, not one short step.

       · Ionised gas glows by recombination, as density squared. Gas inside the front has been heated to ten thousand degrees and has expanded
         and thinned, so the interior is a faint haze; gas just inside the front is fresh off the dense cloud and still dense, so the front
         itself is a bright rim on whatever dense gas faces the star. Its brightness is limited by the star's flux there (weaker further out).
         Colour is natural colour, as a colour camera records it, not the false-colour "Hubble palette": hydrogen's red Hα with a little
         blue-green Hβ makes rose; near a very hot star doubly ionised oxygen ([O III], 501 nm) adds teal, which pales the core; at the front
         itself, [N II] and [S II] make the rim a deeper red.

       · Dust scatters the star's light, forwards more than back, and blue more than red. Round a star too cool to ionise hydrogen that
         scattered light is all there is: a reflection nebula, bluer than its star. Round a cool, still-embedded star the same thing is amber.

       · Dust in front dims and reddens whatever is behind it (blue lost faster than red): the near parts of the cloud stand black against
         the glow, and a star seen through dust is a dim red point long before the camera breaks through to it.

     Departures from the real thing are noted where they are made; the main ones: the star's light is scattered once (plus a small
     allowance for the rest); the ionised gas is thinned, and the gas ahead of the front piled up, by a fixed rule rather than by following
     the flow; the ionising budget is counted against the cloud's broad structure and the front then placed by the fine structure, which
     is a shortcut; the colours of the emission lines are mixed by eye within what the lines allow, not computed from a spectrum; a dark
     cloud has been put where each stop's words go; nothing moves (a cloud like this changes over tens of thousands of years); and the six
     stars are far closer together, and the camera far faster, than anything real.
     ════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════ */
  const D = 14;                                             // distance between one star and the next
  const FOV = SMALL ? 62 : 50, TAN_REF = Math.tan(FOV * Math.PI / 360), ASP_REF = 16 / 9;
  const tanFor = (aspect) => aspect > ASP_REF ? TAN_REF * ASP_REF / aspect : TAN_REF;   // a window wider than 16:9 sees no further to the sides than a 16:9 one does: it is the same picture with the top and bottom cropped, not a wider and wider lens
  const O6 = [0.33, 0.50, 1.0], O9 = [0.37, 0.53, 1.0], B3 = [0.42, 0.58, 1.0], K4 = [1.0, 0.64, 0.36];   // star colours: black bodies at about 40,000 K, 33,000 K, 18,000 K and 4,000 K

  // Where the camera rests at a stop: `dist` from the star, turned by yaw / pitch, with the star at (sx, sy) on the screen (-1 … 1).
  function pose(P, dist, yaw, pitch, sx, sy, aspect, tanv = TAN_REF) {
    const q = new THREE.Quaternion().setFromEuler(new THREE.Euler(pitch * Math.PI / 180, yaw * Math.PI / 180, 0, 'YXZ'));
    const f = new THREE.Vector3(0, 0, -1).applyQuaternion(q), r = new THREE.Vector3(1, 0, 0).applyQuaternion(q), u = new THREE.Vector3(0, 1, 0).applyQuaternion(q);
    const hh = tanv * dist, hw = hh * aspect;
    const C = P.clone().addScaledVector(f, -dist).addScaledVector(r, -sx * hw).addScaledVector(u, -sy * hh);
    return { C, q, f, r, u };
  }
  const V3 = (x, y, z) => new THREE.Vector3(x, y, z);
  // each stop: the star, the resting view, its lamp(s), and the exposure the camera is set to there
  const STOPS = [
    { P: V3(1.5, 0.4, -14), dist: 4.2, yaw: -5, pitch: 1.5, sx: 0.44, sy: 0.12, exp: 1.0,
      lights: [{ o: V3(0, 0, 0), R: 6.5, col: O6, L: 9, Rs: 2.4, em: 0.16, o3: 1.0, lum: 1 },
               { o: V3(0.3, 1.1, 7.0), R: 5.0, col: [1.00, 0.66, 0.50], L: 60, Rs: 2.2, em: 0.12, o3: 0.4, lum: 0 }] },   // (and a second light, deep in the front of the cloud, ahead of the camera and to one side of the way in, so that the gas the camera flies through is lit from in front and glows: so that what the landing's picture gives way to is glowing gas in the picture's own warm colours, and not the dark of an unlit cloud. It is not drawn as a star, and it reaches no further in than the first stop's camera, so nothing at the stops is changed by it)
    { P: V3(1.2, 0.5, -28), dist: 4.0, yaw: 4, pitch: -1, sx: 0.48, sy: 0.14, exp: 1.0,
      lights: [{ o: V3(0, 0, 0), R: 6.5, col: B3, L: 21, Rs: 0, em: 0, o3: 0, lum: 1 }] },
    { P: V3(1.3, 0.0, -42), dist: 4.0, yaw: -3, pitch: 2, sx: 0.40, sy: -0.16, exp: 1.0,
      lights: [{ o: V3(0, 0, 0), R: 6.0, col: K4, L: 5, Rs: 0, em: 0, o3: 0, lum: 0.5 }] },
    { P: V3(2.0, 1.4, -56), dist: 5.0, yaw: 3, pitch: 2, sx: 0.52, sy: 0.50, exp: 1.0,
      lights: [{ o: V3(0, 0, 0), R: 6.9, col: O9, L: 12, Rs: 3.1, em: 0.16, o3: 0.25, lum: 1.2 }] },
    { P: V3(1.3, 0.1, -70), dist: 4.6, yaw: -4, pitch: 0, sx: 0.44, sy: -0.10, exp: 1.0,
      lights: [{ o: V3(0, 0, 0), R: 6.0, col: O9, L: 2.2, Rs: 2.1, em: 0.21, o3: 0, lum: 1 }, { o: V3(0.55, 1.45, -0.2), R: 4.5, col: [1.0, 0.42, 0.16], L: 2.4, Rs: 0, em: 0, o3: 0, lum: 0.6 }] },   // (the fire project: all red. Glowing hydrogen with none of the oxygen's teal, little of the hot star's blue scattered light, and a cool companion whose light on the dust is amber)
    { P: V3(1.2, 0.3, -84), dist: 5.2, yaw: 2, pitch: 1, sx: 0.44, sy: 0.10, exp: 1.0,
      lights: [{ o: V3(0, 0, 0), R: 6.9, col: O6, L: 20, Rs: 2.8, em: 0.19, o3: 2.0, lum: 0.8 }] },   // (the fluid project: blues and greens. o3 above 1 marks gas whose glow is mostly doubly ionised oxygen's green, as round the very hottest stars and in planetary nebulae, with the star's blue light scattered by dust)
  ];
  const REF = STOPS.map((s) => pose(s.P, s.dist, s.yaw, s.pitch, s.sx, s.sy, 16 / 9));       // the stops as composed for a 16:9 screen: the cloud is built round these
  const at = (k, nx, ny, depth) => { const p = REF[k]; return p.C.clone().addScaledVector(p.f, depth).addScaledVector(p.r, nx * TAN_REF * depth * ASP_REF).addScaledVector(p.u, ny * TAN_REF * depth); };

  /* ── the six stars, seen as bodies ──
     Each project's star is drawn as what a young, fast-turning star is: a globe, with a disc of gas in orbit round its equator.
       · Its shape. A turning star is flattened: its surface is a surface of equal potential (gravity plus the centrifugal part), which for
         a star turning at a fraction w of the speed that would break it up gives R(θ) = 3/(w sin θ) · cos[(π + acos(w sin θ))/3] polar radii
         (the Roche model). These are taken as slow turners (w = 0.25), which makes them round to within a hundredth. Drawn as flattened as
         the speed they are shown turning at would really make them, they read as badly drawn circles.
       · Its brightness across the face. Dimmer toward the edge, where the line of sight grazes cooler, higher layers (limb darkening, linear
         law); and brighter at the poles than round the equator, where the surface gravity is weaker: flux ∝ g_eff (von Zeipel's law) for the
         hot stars, much more weakly (T ∝ g^0.08, Lucy's law) for the cool one, whose outer layers boil.
       · Its turning. As one body (hot stars, and young cool ones, are observed to turn almost rigidly), carrying its markings round.
       · The disc. In orbit, each ring at its own speed, Ω ∝ r^-3/2 (Kepler's third law): the inner edge laps the outer many times, so
         whatever is in it is drawn out into trailing arcs. It does not reach the star: a young star's magnetism holds the disc off at a
         couple of radii, and there the disc turns in step with the star (which is how such stars are braked: 'disc locking'). Thin at its
         inner edge and flaring outward, H ∝ r^9/7, as a disc warmed by its star's light is (Chiang & Goldreich 1997). The side nearer the
         camera is the brighter where the disc is dusty (dust throws light mostly forwards).
       · And what it does to the nebula: the disc stands in the star's light, so the gas near the plane of the disc, further out, is in its
         shadow (the lighting of the cloud takes this in; the star HBC 672 throws such a shadow across the Serpens nebula).
     Not real: the sizes (a star seen from this far off would be a point: these are some hundred thousand times too big for their nebulae);
     the speeds (a turn takes such a star days, and its disc's outer edge weeks: here, ten seconds and about a minute); the markings on
     the hot stars (their real surfaces are very nearly featureless: without something to follow, the turning could not be seen); and the
     disc's light, which fades more gently outwards than a real one's so that the disc can be seen to its edge. */
  // R: polar radius · w: turning, as a fraction of break-up · per: seconds per turn · inc, pa: how the axis lies (degrees from the line of sight; and round it, from screen-up)
  // I: surface brightness · ld, beta: limb and gravity darkening · surf: mottling, granulation, spots · disc: inner and outer edge (polar radii), thickness at r = 1, brightness, colours inner and outer, dust, forward-throw, fall-off, spiral
  // The six are not one star six times. Their sizes go by what kind of star each is (a hot supergiant is several times the width of an ordinary hot
  // star, a young sun-like star a fraction of it, the dying star at the heart of a nebula like the last one smaller still), though the true spread is
  // wider than this: drawn to scale, the smallest would be a dot. Each disc is kept about the same width across, whatever the size of its star.
  const SYS = [
    { fade: [7.4, 5.2], R: 0.200, w: 0.25, per: 11, inc: 60, pa: -14, I: 3.9, ld: 0.32, beta: 0.25, surf: [0.45, 0.16, 0.0], rin: 2.10, rout: 5.6, h0: 0.090, db: 1.35, c1: [1.00, 0.66, 0.70], c2: [1.00, 0.30, 0.38], dust: 0.0, g: 0.25, pw: 1.9, arm: 3.2 },   // a hot giant (O6)
    { R: 0.135, w: 0.25, per: 9, inc: 62, pa: 17, I: 3.7, ld: 0.34, beta: 0.25, surf: [0.45, 0.16, 0.0], rin: 2.20, rout: 7.6, h0: 0.075, db: 1.15, c1: [0.86, 0.90, 1.00], c2: [0.50, 0.62, 1.00], dust: 0.0, g: 0.35, pw: 1.8, arm: 2.6 },    // an ordinary hot star (B3)
    { R: 0.095, w: 0.25, per: 13, inc: 58, pa: -24, I: 3.3, ld: 0.68, beta: 0.08, surf: [0.10, 0.34, 0.55], rin: 2.30, rout: 11.0, h0: 0.055, db: 1.00, c1: [1.00, 0.72, 0.40], c2: [0.86, 0.44, 0.20], dust: 1.5, g: 0.55, pw: 1.6, arm: 4.0 },  // a young sun-like star (K4), small, in a wide dusty disc
    { R: 0.165, w: 0.25, per: 11, inc: 61, pa: 10, I: 3.8, ld: 0.32, beta: 0.25, surf: [0.45, 0.16, 0.0], rin: 2.10, rout: 6.6, h0: 0.085, db: 1.25, c1: [1.00, 0.68, 0.74], c2: [0.98, 0.34, 0.46], dust: 0.0, g: 0.25, pw: 1.9, arm: 3.0 },    // a hot star (O9)
    { R: 0.265, w: 0.25, per: 14, inc: 56, pa: -8, I: 3.2, ld: 0.34, beta: 0.25, surf: [0.45, 0.16, 0.0], rin: 1.95, rout: 4.4, h0: 0.085, db: 1.40, c1: [1.00, 0.70, 0.56], c2: [1.00, 0.22, 0.14], dust: 0.3, g: 0.35, pw: 1.8, arm: 3.6 },    // a blue supergiant (O9 I): the biggest
    { R: 0.075, w: 0.25, per: 8, inc: 61, pa: 21, I: 5.0, ld: 0.30, beta: 0.25, surf: [0.45, 0.16, 0.0], rin: 2.40, rout: 13.0, h0: 0.045, db: 1.25, c1: [0.84, 1.00, 0.96], c2: [0.26, 0.92, 0.74], dust: 0.0, g: 0.25, pw: 1.6, arm: 3.0 },    // the small, very hot star at the heart of a nebula like this one: the smallest
  ];
  SYS.forEach((y, k) => { const F = REF[k], i = y.inc * Math.PI / 180, a = y.pa * Math.PI / 180;
    const los = STOPS[k].P.clone().sub(F.C).normalize(), up = F.u.clone().addScaledVector(los, -F.u.dot(los)).normalize(), rt = new THREE.Vector3().crossVectors(los, up);   // the line of sight from the resting camera to the star (not the way the camera faces: the star is off to one side), and screen-up and screen-right across it
    y.axis = los.clone().multiplyScalar(-Math.cos(i)).addScaledVector(up, Math.sin(i) * Math.cos(a)).addScaledVector(rt, Math.sin(i) * Math.sin(a)).normalize();

    y.W2 = y.w * y.w * 8 / 27; });                                     // the turning rate squared (units in which GM and the polar radius are 1)

  /* Things placed in the cloud by hand, on top of the turbulence: each is a tapered capsule (A, radius at A) → (B, radius at B) inside which the
     log-density is raised (a dense body) or lowered (a gap). Up to six per stop. They are still turbulent gas, lit, shadowed and eaten into by the star
     like the rest. Every stop has a gap along the line of sight (one looks into a nebula through a break in the cloud) and a dense, dark body on
     the left of the frame, which is where the words go. */

  const prim = (k, A, rA, B, rB, amp) => { (prims[k] = prims[k] || []).push({ A, rA, B, rB, amp }); };
  const sightAndDark = (k) => { const s = STOPS[k], p = REF[k];
    prim(k, p.C.clone().lerp(s.P, 0.3), 0.45, s.P.clone(), 0.6, -1.8);                                    // the gap the star is seen through
    prim(k, at(k, -0.52, -0.80, 2.1), 1.15, at(k, -0.40, 0.75, 2.5), 1.25, 4.2); };            // the dark cloud on the left

  sightAndDark(1); prims[1][1] = { A: at(1, -0.54, -0.85, 2.0), rA: 1.1, B: at(1, -0.38, 0.8, 2.4), rB: 1.2, amp: 4.4 }; prim(1, STOPS[1].P.clone(), 0.45, STOPS[1].P.clone(), 0.45, -2.5); prim(1, STOPS[1].P.clone().add(V3(0.5, 0.5, -1.0)), 1.6, STOPS[1].P.clone().add(V3(0.5, 0.5, -1.0)), 1.6, 1.2);
  // 3 · a star still inside the core it formed from, its light getting out along the cone its outflow has opened and lighting the cone's walls: a fan of amber, the star at its tip
  { const k = 2, p = REF[k], P = STOPS[k].P, ax = V3(0, 0, 0).addScaledVector(p.r, 0.42).addScaledVector(p.u, 0.88).addScaledVector(p.f, -0.22).normalize();
    prim(k, p.C.clone(), 0.45, P.clone().addScaledVector(ax, 0.4), 0.6, -1.8);
    prim(k, at(k, -0.52, -0.80, 2.1), 1.15, at(k, -0.40, 0.75, 2.5), 1.25, 4.2);
    prim(k, P.clone().addScaledVector(ax, -0.9), 1.5, P.clone().addScaledVector(ax, -0.9), 1.5, 2.2);
    prim(k, P.clone().addScaledVector(ax, 0.0), 0.16, P.clone().addScaledVector(ax, 3.4), 1.5, -5.0); }
  // 4 · the edge of the cloud, seen from the side, with the star above it eating down into it: the front is the bright line along the top, and
  //     where a dense knot shades the gas behind it a pillar is left standing, pointing at the star (the Eagle's pillars, Carina's cliffs)
  { const k = 3, P = STOPS[k].P; prim(k, at(k, 0.1, 0.15, 1.5), 0.6, P.clone().lerp(at(k, 0.2, 0.3, 4.4), 0.35), 1.6, -2.4);
    prim(k, at(k, -0.56, -0.80, 2.1), 1.15, at(k, -0.46, 0.75, 2.5), 1.25, 4.2);
    prim(k, at(k, -0.6, -0.95, 5.0), 1.5, at(k, 1.1, -0.78, 5.6), 1.7, 3.2);
    for (const [nx, ny, dz, len] of [[0.10, 0.10, 0.0, 3.0], [0.37, -0.06, 0.4, 2.6]]) { const H = at(k, nx, ny, STOPS[k].dist + dz), dir = H.clone().sub(P).normalize(); prim(k, H, 0.2, H.clone().addScaledVector(dir, len), 0.6, 5.6); } }
  // 5 · a hot star's glowing gas with a cooler star's blue reflection nebula beside it, dark dust across both (the Trifid is this)
  { const k = 4; sightAndDark(k); const Pb = STOPS[k].P.clone().add(STOPS[k].lights[1].o); prim(k, Pb.clone(), 0.4, Pb.clone(), 0.4, -2.5); }
  // 6 · a small cluster that has blown its cavity open through the far side of the cloud
  sightAndDark(5); prims[5][1] = { A: at(5, -0.56, -0.85, 2.0), rA: 1.1, B: at(5, -0.40, 0.8, 2.4), rB: 1.2, amp: 4.4 };
  const uPA = [], uPB = [], uPC = [];
  for (let k = 0; k < 6; k++) for (let j = 0; j < NPS; j++) { const p = (prims[k] || [])[j]; if (p) { uPA.push(new THREE.Vector4(p.A.x, p.A.y, p.A.z, p.rA)); uPB.push(new THREE.Vector4(p.B.x, p.B.y, p.B.z, p.rB)); uPC.push(p.amp); } else { uPA.push(new THREE.Vector4()); uPB.push(new THREE.Vector4()); uPC.push(0); } }

  /* The camera's route (as composed for a 16:9 screen): from outside the cloud to each stop's resting place, passing close beside each star on
     the way to the next. The cloud is thinner along it: the flight follows a lane through the gas, with the denser cloud to either side, so
     that what lies ahead can be seen from a distance. Its line is kept in a small table (x, y for each z) for the cloud's density to read. */
  const START = { C: V3(-0.6, 0.5, 9.5), q: new THREE.Quaternion().setFromEuler(new THREE.Euler(-0.02, 0.03, 0, 'YXZ')) };
  const VIA = STOPS.map((s, k) => s.P.clone().addScaledVector(REF[k].r, -1.5).addScaledVector(REF[k].u, -0.35).addScaledVector(REF[k].f, 1.1));
  const pathTex = (() => { const pts = [START.C]; REF.forEach((p, k) => { pts.push(p.C); pts.push(VIA[k]); }); pts.push(VIA[5].clone().add(V3(0, 0, -12)));
    const c = new THREE.CatmullRomCurve3(pts, false, 'centripetal'), M = 3000, sm = []; for (let i = 0; i <= M; i++) sm.push(c.getPoint(i / M));
    const n = 256, d = new Uint16Array(n * 4); let j = 0;
    for (let i = 0; i < n; i++) { const z = 10 - 104 * (i + 0.5) / n; while (j < M - 1 && sm[j + 1].z > z) j++; const a = sm[j], b = sm[j + 1], t = clamp((a.z - z) / Math.max(1e-6, a.z - b.z), 0, 1);
      d[i * 4] = THREE.DataUtils.toHalfFloat(a.x + (b.x - a.x) * t); d[i * 4 + 1] = THREE.DataUtils.toHalfFloat(a.y + (b.y - a.y) * t); d[i * 4 + 3] = THREE.DataUtils.toHalfFloat(1); }
    const t = new THREE.DataTexture(d, n, 1, THREE.RGBAFormat, THREE.HalfFloatType); t.minFilter = t.magFilter = THREE.LinearFilter; t.wrapS = t.wrapT = THREE.ClampToEdgeWrapping; t.needsUpdate = true; return t; })();

  // the lamps, two slots per stop
  const LIGHTS = []; const uLP = [], uLC = [], uLE = []; let nSlab = 0;
  for (let k = 0; k < 6; k++) for (let j = 0; j < 2; j++) { const l = STOPS[k].lights[j];
    if (!l) { uLP.push(new THREE.Vector4(0, 0, 0, 0)); uLC.push(new THREE.Vector4()); uLE.push(new THREE.Vector4()); continue; }
    const pos = STOPS[k].P.clone().add(l.o); l.pos = pos; l.slab = nSlab++; l.stop = k; LIGHTS.push(l);
    uLP.push(new THREE.Vector4(pos.x, pos.y, pos.z, l.R)); uLC.push(new THREE.Vector4(l.col[0] * l.L, l.col[1] * l.L, l.col[2] * l.L, l.Rs > 0 ? 1 : 0)); uLE.push(new THREE.Vector4(l.em, 1.35 * Math.pow(l.Rs, 1.5), l.slab, l.o3)); }
  const LW = SMALL ? 128 : 192, LH = LW / 2, LD = SMALL ? 80 : 128;

  /* ── the noise the turbulence is made from: a tiling 64³ volume, made on the graphics card ── */
  /* ── the gas moves ──
     The cloud is not a still. Its gas is carried by a slow, large flow: three gentle swirls of different sizes turning at different rates, so the
     gas shears, folds and billows and never comes back to quite the same shape. (Real clouds like this are turbulent and are being pushed about
     by their stars; the real thing takes thousands of years, and this is that, greatly sped up.) It is done by moving the place each bit of
     gas is looked up from, so everything belonging to the gas, coarse and fine, moves together and nothing slides over anything else.
     The picture is built up over many frames (see below), which only works if the renderer knows where the gas it drew a moment ago has got
     to. Because the flow is a known formula, it does: flowAt is used again there, so the picture stays sharp while the gas moves.
     What does not follow the flow: the stars' shadow and ionisation maps, which are worked out once when the page loads. The flow is kept
     small (a third of a unit at most) so that the gas never moves far from where those maps expect it. */
  const FLOW = /* glsl */`
    vec3 flowAt(vec3 p,float t){ return 0.12*sin(p.yzx*0.62+vec3(0.7,2.9,4.4)+t*vec3(0.120,0.098,0.110))
                                        +0.05*sin(p.zxy*1.90+vec3(3.1,0.4,1.8)+t*vec3(0.32,0.26,0.36))
                                        +0.025*sin(p.yzx*3.10+vec3(5.2,1.1,2.7)+t*vec3(0.66,0.76,0.58)); }`;   // (amplitudes small enough that the gas stays where the stars' light maps expect it)
  // The same, for the two passes that have to follow the gas: how far the gas at P has been carried between two times. Close beside a star it is
  // taken as nothing: what is seen there is the star's own glow, which stays with the star.
  const FLOWS = FLOW + /* glsl */`
    uniform vec3 uSP6[6];
    vec3 flowShift(vec3 P,float t1,float t0){ float ds=1e9; for(int k=0;k<6;k++){ vec3 e=P-uSP6[k]; ds=min(ds,dot(e,e)); } return (flowAt(P,t1)-flowAt(P,t0))*smoothstep(0.35,1.6,sqrt(ds)); }`;
  // And where on a picture of the gas (made when the gas's clock read tR) to find the gas that the flow has carried to screen position x by time tD.

      dsm.u.tPrev.value = dsA.texture; dsm.u.uK.value = fresh ? 1 : 0.1 + 0.5 * clamp(mv / dt / 320, 0, 1); run(dsm, dsB); { const t = dsA; dsA = dsB; dsB = t; } warpU.tDS.value = dsA.texture;
      resolve.u.tHist.value = histA.texture[0]; resolve.u.tHistN.value = histA.texture[1]; resolve.u.uReset.value = fresh ? 1 : 0; run(resolve, histB); run(wfield, wfRT);
      { const t = histA; histA = histB; histB = t; } resolve.u.pCam.value.copy(viewU.uCam.value); resolve.u.pRot.value.copy(viewU.uRot.value);
      compU.tCloud.value = histA.texture[0]; compU.tHistN.value = histA.texture[1]; fresh = false;
    }
    stars(dt); sky.position.copy(cam.position); sky.material.uniforms.uT.value = time; lens.uniforms.uTime.value = time;
    composer.render();
  }
  window.__p3 = { stats, sys: SYSM, lightU, get sE() { return sE; }, set sE(v) { sE = v; vE = 0; }, get size() { return [curRT.width, curRT.height, histA.width, histA.height]; }, setBudget(v) { BUDGET = v; sizeCloud(); }, frame: (t) => frame(t, true) };   // (for measuring; nothing on the page uses it)
  layout(sE); requestAnimationFrame((t) => { last = t; root.classList.add('ready'); frame(t); });
}
if (!renderer) layout(0);

/* ── the landing's picture, given life ──
   The illustration is a still. Shown through this small program, what is in it moves as it would:
     · The torus turns. Of a ring seen from a little above its plane it is the near wall that shows the turning: it slides across the screen,
       fastest in the middle and not at all at the two tips (where the movement is toward or away from the viewer). The surface is carried
       round; the light on it stays where it is, since the light comes from the quasar and not from the dust. (For that the picture is split
       into its broad light and shade, kept still, and its fine markings, which are what is moved.)
     · The outflow streams outward from the quasar along the two lobes, faster the further out (a wind driven from the centre keeps gaining
       speed), and turns about the lobes' axis as it goes, as gas thrown off a turning ring does.
     · Shafts of light from the heart shimmer in the lobes, and the heart itself wavers a little.
   Nothing else moves. (The lit inside of the torus and the thin dust in its plane were moved too, the one sliding the other way and the other
   drifting in, as they would; but in a flat picture, movements in opposite directions side by side read as a fault, not as depth.)
   The picture's own clouds are moved by fetching each point from a little way back along its path, in two copies half a cycle apart and faded
   across each other, so the movement never has to jump back. On top of that, a faint moving unevenness (brighter and dimmer, a few tenths)
   travels the same way, which is what lets the eye follow the movement. Speeds are for the eye: a real torus takes thousands of years to turn.
   If the program cannot run, or the visitor asks for reduced motion, the plain image underneath is what shows. */
(() => { const host = document.querySelector('#plate .pl'); if (!host || matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const img = host.querySelector('img'), cv = host.querySelector('canvas'), gl = cv.getContext('webgl', { alpha: true, premultipliedAlpha: true, antialias: false }); if (!gl) return;
  const sh = (type, src) => { const o = gl.createShader(type); gl.shaderSource(o, src); gl.compileShader(o); if (!gl.getShaderParameter(o, gl.COMPILE_STATUS)) { console.warn('plate shader', gl.getShaderInfoLog(o)); return null; } return o; };
  const prog = (fsrc) => { const a = sh(gl.VERTEX_SHADER, 'attribute vec2 a; varying vec2 v; void main(){ v=vec2(a.x*0.5+0.5,0.5-a.y*0.5); gl_Position=vec4(a,0.0,1.0); }'), b = sh(gl.FRAGMENT_SHADER, fsrc); if (!a || !b) return null;
    const p = gl.createProgram(); gl.attachShader(p, a); gl.attachShader(p, b); gl.bindAttribLocation(p, 0, 'a'); gl.linkProgram(p); return gl.getProgramParameter(p, gl.LINK_STATUS) ? p : null; };
  // Where things are in the picture (0…1 across, 0…1 down), and the regions built on them. C: the quasar's heart · TC, TM, TN, TA, TB: the torus's outline
  // (an ellipse: centre, long axis, short axis toward the viewer's side, half-lengths) · AX: the outflow's axis, toward the upper lobe (the lower is opposite)
  const GEO = `precision highp float; varying vec2 v; uniform float uT;
    const vec2 C=vec2(0.472,0.531), TC=vec2(0.480,0.555), TM=vec2(0.919,-0.393), TN=vec2(0.393,0.919), AX=vec2(-0.43,-0.903);
    const float TA=0.127, TB=0.056, PER=7.0;
    float r,s,x,lobe,u,w,prof,mn; vec2 d;
    void geo(){ d=v-C; r=length(d); s=dot(d,AX); x=dot(d,vec2(-AX.y,AX.x))/(0.10+0.40*abs(s));
      lobe=smoothstep(0.07,0.22,r)*exp(-x*x*1.2)*smoothstep(0.02,0.09,abs(s));              // in one of the two lobes of the outflow (which begin a little way off the torus's plane: right beside the torus nothing streams)
      vec2 dt=v-TC; u=dot(dt,TM)/TA; w=dot(dt,TN)/TB; float rr=length(vec2(u,w)), we=-0.09-0.20*u*u; prof=sqrt(max(1.0-u*u,0.0));   // across the torus (−1…1 tip to tip) · toward the viewer's side · we: where its near wall's top edge runs
      mn=smoothstep(-0.06,0.05,w-we)*(1.0-smoothstep(0.90,1.02,rr)); }`;                          // on the torus's near wall
  // The soft things, worked out small (they have no fine detail) and read back by the pass that fills the screen: the travelling unevenness of the outflow
  // and of the torus (red) · the shafts of light (green) · the little eddies in the flow (blue, alpha)
  const pA = prog(GEO + `
    float h1(vec2 p){ return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453); }
    float h3(vec3 p){ return fract(sin(dot(p,vec3(127.1,311.7,74.7)))*43758.5453); }
    float n2(vec2 p){ vec2 i=floor(p), f=fract(p); f=f*f*(3.0-2.0*f); return mix(mix(h1(i),h1(i+vec2(1.0,0.0)),f.x),mix(h1(i+vec2(0.0,1.0)),h1(i+vec2(1.0,1.0)),f.x),f.y); }
    float n3(vec3 p){ vec3 i=floor(p), f=fract(p); f=f*f*(3.0-2.0*f);
      return mix(mix(mix(h3(i),h3(i+vec3(1.0,0.0,0.0)),f.x),mix(h3(i+vec3(0.0,1.0,0.0)),h3(i+vec3(1.0,1.0,0.0)),f.x),f.y),
                 mix(mix(h3(i+vec3(0.0,0.0,1.0)),h3(i+vec3(1.0,0.0,1.0)),f.x),mix(h3(i+vec3(0.0,1.0,1.0)),h3(i+vec3(1.0,1.0,1.0)),f.x),f.y),f.z); }
    float fbm(vec3 p){ return 0.5*n3(p)+0.3*n3(p*2.03+7.1)+0.2*n3(p*4.01+3.3); }
    void main(){ geo(); float ang=atan(d.y,d.x);
      float m=1.0+0.48*prof*mn*(n2(vec2(u*9.0+uT*0.76,w*6.0))-0.5);                                                       // lumps going round with the torus
      float ph=asin(clamp(x,-1.0,1.0))+uT*0.10; vec3 P=vec3(abs(s)*7.0-uT*0.40,cos(ph)*1.8,sin(ph)*1.8+(s<0.0?5.0:0.0));
      m*=1.0+0.52*lobe*(fbm(P)-0.5)*smoothstep(0.08,0.30,r);                                                              // the outflow: billows travelling outward, and round the axis
      m*=1.0+(0.045*sin(uT*1.3)+0.03*sin(uT*2.9+1.0))*exp(-r*r/0.006);                                                    // the light at the heart wavers
      float ray=n2(vec2(ang*9.0,uT*0.22))*n2(vec2(ang*23.0+5.0,uT*0.31));
      gl_FragColor=vec4(m*0.5,ray*ray*lobe*exp(-r*3.2)*smoothstep(0.03,0.12,r)*4.0,n2(v*5.0+3.1),n2(v*5.0+7.7)); }`);
  const pB = prog(GEO + `uniform sampler2D t,tl,ta;
    void main(){ geo(); vec4 A=texture2D(ta,vec2(v.x,1.0-v.y)); float tor=mn;   // (the small picture of the soft things is stored the other way up: read it so. Read straight, the torus's moving lumps showed again as a ghost above the torus, going the wrong way)
      vec2 fOut=normalize(normalize(d+1e-4)*0.5+AX*(s<0.0?-1.0:1.0)*0.5)*(0.012+0.075*r)+(A.ba-0.5)*0.012;                // outward from the quasar, drawn toward the axis; faster further out
      vec2 f=fOut*lobe*(1.0-tor)-TM*0.075*prof*mn;                                                                        // + the torus's near wall, sliding along its length
      float a0=fract(uT/PER), a1=fract(uT/PER+0.5), wg=abs(1.0-2.0*a0); vec2 q0=v-f*(a0-0.5), q1=v-f*(a1-0.5);
      vec3 c0=texture2D(t,q0).rgb, c1=texture2D(t,q1).rgb;
      if(tor>0.001){ vec3 Lp=texture2D(tl,v).rgb+0.03; c0=mix(c0,c0*Lp/(texture2D(tl,q0).rgb+0.03),tor); c1=mix(c1,c1*Lp/(texture2D(tl,q1).rgb+0.03),tor); }   // on the torus: the markings are carried, the light and shade stay
      float al=smoothstep(0.0,0.14,v.x)*(1.0-smoothstep(0.93,1.0,v.x));                                                    // fading out at the picture's left and right edges
      gl_FragColor=vec4((mix(c0,c1,wg)*(A.r*2.0)+vec3(0.70,0.80,1.0)*A.g*0.055)*al,al); }`);
  if (!pA || !pB) return;
  const b = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, b); gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW); gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
  const mkTex = (unit, src, size) => { const tex = gl.createTexture(); gl.activeTexture(gl.TEXTURE0 + unit); gl.bindTexture(gl.TEXTURE_2D, tex);
    if (src) gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGB, gl.RGB, gl.UNSIGNED_BYTE, src); else gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, size, size, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE); return tex; };
  const start = () => { let fbo; const AS = 512;
    try { mkTex(0, img);
      const mid = document.createElement('canvas'), low = document.createElement('canvas'); mid.width = mid.height = 512; low.width = low.height = 96;   // the picture's broad light and shade alone: the picture made very small (and so, when it is read back, very soft)
      const mx = mid.getContext('2d'), lx = low.getContext('2d'); mx.imageSmoothingQuality = lx.imageSmoothingQuality = 'high'; mx.drawImage(img, 0, 0, 512, 512); lx.drawImage(mid, 0, 0, 96, 96); mkTex(1, low);
      const ta = mkTex(2, null, AS); fbo = gl.createFramebuffer(); gl.bindFramebuffer(gl.FRAMEBUFFER, fbo); gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, ta, 0);
      if (gl.checkFramebufferStatus(gl.FRAMEBUFFER) !== gl.FRAMEBUFFER_COMPLETE) return; gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    } catch (e) { return; }
    const uTA = gl.getUniformLocation(pA, 'uT'), uTB = gl.getUniformLocation(pB, 'uT'); gl.useProgram(pB); gl.uniform1i(gl.getUniformLocation(pB, 't'), 0); gl.uniform1i(gl.getUniformLocation(pB, 'tl'), 1); gl.uniform1i(gl.getUniformLocation(pB, 'ta'), 2);
    const fit = () => { const px = Math.min(2200, Math.round(host.clientWidth * Math.min(devicePixelRatio || 1, 2))) || 1024; if (cv.width !== px) cv.width = cv.height = px; };
    fit(); addEventListener('resize', fit); const t0 = performance.now();
    const draw = (now) => { requestAnimationFrame(draw); if (!(plateOp > 0) || document.hidden) return; const T = (now - t0) / 1000;
      gl.bindFramebuffer(gl.FRAMEBUFFER, fbo); gl.viewport(0, 0, AS, AS); gl.useProgram(pA); gl.uniform1f(uTA, T); gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
      gl.bindFramebuffer(gl.FRAMEBUFFER, null); gl.viewport(0, 0, cv.width, cv.height); gl.useProgram(pB); gl.uniform1f(uTB, T); gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4); cv.classList.add('on'); };
    requestAnimationFrame(draw); };
  if (img.complete && img.naturalWidth) start(); else img.addEventListener('load', start, { once: true });
})();
</script>
