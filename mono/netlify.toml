[build]
  command = "yarn build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "18"

# Netlify Next.js plugin handles the runtime
[[plugins]]
  package = "@netlify/plugin-nextjs"

# Cache static assets for faster repeat visits
[[headers]]
  for = "/video/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.webp"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

